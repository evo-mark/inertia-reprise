name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push tags, create releases
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Previous tag
        id: previous
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      # Works out the next version from the commit messages in the push:
      # #major, #minor or #patch. Nothing is tagged yet (DRY_RUN), so a failed
      # build leaves no stray tag; the release step creates it.
      - name: Next version
        id: tag
        uses: anothrNick/github-tag-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: none
          DRY_RUN: true
          WITH_V: true
          RELEASE_BRANCHES: main

      - name: Detect release
        id: release
        env:
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
          OLD_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          if [ -n "$NEW_TAG" ] && [ "$NEW_TAG" != "$OLD_TAG" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=${NEW_TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "No #major, #minor or #patch commit found; skipping release."
          fi

      - uses: pnpm/action-setup@v6
        if: steps.release.outputs.released == 'true'
        with:
          version: 11

      - uses: actions/setup-node@v7
        if: steps.release.outputs.released == 'true'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install
        if: steps.release.outputs.released == 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Lint, typecheck, test and build
        if: steps.release.outputs.released == 'true'
        run: |
          pnpm lint
          pnpm format:check
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Publish to npm
        if: steps.release.outputs.released == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version
          npm publish --access public

      - name: Create GitHub release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
